<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduAid - Admin Panel</title>

  <!-- AOS and Bootstrap CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #e8f5e9, #ffffff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    table th, table td {
      vertical-align: middle;
    }
    .status-select {
      min-width: 150px;
    }
    .form-section {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);
    }
    .nav-tabs .nav-link.active {
      background-color: #198754;
      color: white;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .nav-tabs .nav-link {
      color: #198754;
      font-weight: 500;
      transition: 0.3s ease;
    }
    .nav-tabs .nav-link:hover {
      background-color: #e6f4ec;
    }
    .table-bordered {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .btn-success, .btn-danger, .btn-primary, .btn-warning {
      border-radius: 6px;
      transition: all 0.3s ease-in-out;
    }
    .btn-success:hover {
      background-color: #145c37;
    }
    .btn-danger:hover {
      background-color: #a82323;
    }
    .btn-warning:hover {
      background-color: #e3aa00;
    }
    .btn-primary:hover {
      background-color: #0a58ca;
    }
    .tab-pane {
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    footer {
      background: linear-gradient(to right, #198754, #145c37);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="images/logo.png" alt="EduAid Logo" height="40" class="me-2" />
        <span class="fw-bold text-success">EduAid Admin</span>
      </a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item me-3">
          <a class="nav-link position-relative text-success" href="#">
            🔔
            <span id="notifCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
          </a>
        </li>
      </ul>
      <div class="collapse navbar-collapse justify-content-end">
        <a class="btn btn-danger" href="home.html">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Tabs -->
  <div class="container mt-5">
    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="apps-tab" data-bs-toggle="tab" data-bs-target="#apps" type="button" role="tab">Applications</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="schol-tab" data-bs-toggle="tab" data-bs-target="#scholarships" type="button" role="tab">Scholarships</button>
      </li>
    </ul>

    <div class="tab-content" id="adminTabsContent">
      <!-- Applications Tab -->
      <div class="tab-pane fade show active" id="apps" role="tabpanel" aria-labelledby="apps-tab">
        <h2 class="text-success mb-4 text-center">Manage Applications</h2>
        <button class="btn btn-primary mb-3" onclick="downloadSelected()">Download Selected as PDF</button>
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-success">
              <tr>
                <th><input type="checkbox" onclick="toggleAll(this)"></th>
                <th>ID</th><th>Name</th><th>Father Name</th><th>Scholarship</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="applicationsTable">
              <tr><td colspan="7" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Scholarships Tab -->
      <div class="tab-pane fade" id="scholarships" role="tabpanel" aria-labelledby="schol-tab">
        <h2 class="text-success mb-4 text-center">Manage Scholarships</h2>
        <div class="form-section mb-4">
          <h5>Add / Edit Scholarship</h5>
          <form id="scholarshipForm">
            <input type="hidden" id="scholarshipId" name="id">
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" id="title" class="form-control" placeholder="Scholarship Title" required />
              </div>
              <div class="col-md-6">
                <input type="date" id="deadline" class="form-control" placeholder="Deadline" required />
              </div>
              <div class="col-md-12">
                <textarea id="description" class="form-control" placeholder="Description" rows="2" required></textarea>
              </div>
              <div class="col-md-12">
                <textarea id="eligibility" class="form-control" placeholder="Eligibility Criteria" rows="2" required></textarea>
              </div>
              <div class="col-md-6">
                <input type="number" id="seats_left" class="form-control" placeholder="Seats Left" required />
              </div>
              <div class="col-md-6">
                <button type="submit" class="btn btn-success w-100">Save Scholarship</button>
              </div>
            </div>
          </form>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered">
            <thead class="table-success">
              <tr>
                <th>ID</th><th>Title</th><th>Deadline</th><th>Seats Left</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="scholarshipsTable">
              <tr><td colspan="5" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-success text-white text-center py-3 mt-5">
    <p class="mb-0">© 2025 EduAid | Admin Panel</p>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    AOS.init();

    // Load Applications
    fetch('/api/applications', { credentials: 'include' })
      .then(res => res.json())
      .then(data => {
        const table = document.getElementById('applicationsTable');
        table.innerHTML = '';
        if (!data.length) return table.innerHTML = '<tr><td colspan="7" class="text-center">No applications found.</td></tr>';
        data.forEach(app => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><input type="checkbox" class="app-check" value="${app.id}"></td>
            <td>${app.id}</td><td>${app.name}</td><td>${app.father_name}</td>
            <td>${app.scholarship_type}</td>
            <td>
              <select class="form-select status-select" onchange="updateStatus(${app.id}, this.value)">
                <option ${app.status === 'Unverified' ? 'selected' : ''}>Unverified</option>
                <option ${app.status === 'Verified' ? 'selected' : ''}>Verified</option>
                <option ${app.status === 'Granted' ? 'selected' : ''}>Granted</option>
                <option ${app.status === 'Not Eligible' ? 'selected' : ''}>Not Eligible</option>
              </select>
            </td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteApp(${app.id})">Delete</button></td>
          `;
          table.appendChild(row);
        });
      });

    function toggleAll(source) {
      document.querySelectorAll(".app-check").forEach(cb => cb.checked = source.checked);
    }

    function downloadSelected() {
      const selected = Array.from(document.querySelectorAll(".app-check:checked"))
                            .map(cb => cb.value);
      if (!selected.length) return alert("Please select at least one application.");
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "/api/download-selected";
      form.style.display = "none";
      const input = document.createElement("input");
      input.name = "ids";
      input.value = selected.join(",");
      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
    }

    function updateStatus(id, status) {
      fetch('/api/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `id=${id}&status=${status}`,
        credentials: 'include'
      }).then(res => res.text()).then(alert);
    }

    function deleteApp(id) {
      if (!confirm('Delete this application?')) return;
      fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `id=${id}`,
        credentials: 'include'
      }).then(() => location.reload());
    }

    function deleteScholarship(id) {
      if (!confirm('Delete this scholarship?')) return;
      fetch('/api/scholarships/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `id=${id}`,
        credentials: 'include'
      }).then(() => loadScholarships());
    }

    function loadScholarships() {
      fetch('/api/scholarships', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          const table = document.getElementById('scholarshipsTable');
          table.innerHTML = '';
          if (!data.length) return table.innerHTML = '<tr><td colspan="5" class="text-center">No scholarships found.</td></tr>';
          data.forEach(s => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${s.id}</td>
              <td>${s.title}</td>
              <td>${s.deadline}</td>
              <td>${s.seats_left}</td>
              <td>
                <button class="btn btn-sm btn-warning me-2 edit-btn" data-id="${s.id}" data-title="${encodeURIComponent(s.title)}"
                  data-description="${encodeURIComponent(s.description)}" data-eligibility="${encodeURIComponent(s.eligibility)}"
                  data-deadline="${s.deadline}" data-seats="${s.seats_left}">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteScholarship(${s.id})">Delete</button>
              </td>
            `;
            table.appendChild(row);
          });
        });
    }

    loadScholarships();
    setInterval(() => {
      fetch('/api/notifications', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          const badge = document.getElementById('notifCount');
          badge.textContent = data.newCount || 0;
          badge.style.display = data.newCount > 0 ? 'inline-block' : 'none';
        });
    }, 10000);
  
// Handle scholarship form submit
document.getElementById('scholarshipForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const id = document.getElementById('scholarshipId').value.trim();
  const title = document.getElementById('title').value.trim();
  const deadline = document.getElementById('deadline').value.trim();
  const description = document.getElementById('description').value.trim();
  const eligibility = document.getElementById('eligibility').value.trim();
  const seats_left = document.getElementById('seats_left').value.trim();

  const formData = new URLSearchParams();
  formData.append("id", id);
  formData.append("title", title);
  formData.append("deadline", deadline);
  formData.append("description", description);
  formData.append("eligibility", eligibility);
  formData.append("seats_left", seats_left);

  const endpoint = id ? "/api/scholarships/edit" : "/api/scholarships/add";

  fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: formData.toString(),
    credentials: "include"
  })
  .then(res => res.text())
  .then(msg => {
    alert(msg);
    document.getElementById('scholarshipForm').reset();
    document.getElementById('scholarshipId').value = "";
    loadScholarships();
  });
});

// Fill form when Edit is clicked
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("edit-btn")) {
    document.getElementById('scholarshipId').value = e.target.dataset.id;
    document.getElementById('title').value = decodeURIComponent(e.target.dataset.title);
    document.getElementById('description').value = decodeURIComponent(e.target.dataset.description);
    document.getElementById('eligibility').value = decodeURIComponent(e.target.dataset.eligibility);
    document.getElementById('deadline').value = e.target.dataset.deadline;
    document.getElementById('seats_left').value = e.target.dataset.seats;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});
  </script>
</body>
</html>
