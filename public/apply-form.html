<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduAid - Apply Now</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    .form-step { display: none; }
    .form-step.active { display: block; }
    .step-buttons { margin-top: 20px; text-align: right; }
    .step-buttons button { margin-left: 10px; }
    .file-preview { font-size: 0.9rem; margin-top: 10px; color: #333; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/logo.png" alt="EduAid Logo" height="40" class="me-2" />
        <span class="fw-bold text-success">EduAid</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link text-success" href="index3.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-success" href="how-it-works.html">How It Works</a></li>
          <li class="nav-item"><a class="nav-link text-success" href="scholarships.html">Find Your Scholarship</a></li>
          <li class="nav-item"><a class="nav-link text-success" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link text-success" href="news.html">News</a></li>
        </ul>
        <a class="btn btn-success ms-3" href="contact.html">Contact Us</a>
      </div>
    </div>
  </nav>

  <!-- Form Section -->
  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center text-success mb-4">Scholarship Application Form</h2>
      <form id="applicationForm" action="/submit-application" method="POST" enctype="multipart/form-data">
        <!-- Step 1: Personal Info -->
        <div class="form-step active">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="name" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Father's Name</label>
              <input type="text" class="form-control" name="fatherName" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" class="form-control" name="dob" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Domicile</label>
              <select class="form-select" name="domicile" required>
                <option value="">Select Province</option>
                <option>Punjab</option><option>Sindh</option><option>Khyber Pakhtunkhwa</option>
                <option>Balochistan</option><option>Islamabad Capital Territory</option>
                <option>Gilgit-Baltistan</option><option>Azad Jammu and Kashmir</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">City</label>
              <input type="text" class="form-control" name="city" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" name="phone" pattern="03[0-9]{9}" placeholder="03XXXXXXXXX" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" required />
            </div>
          </div>
          <div class="step-buttons mt-4">
            <button type="button" class="btn btn-success" onclick="nextStep()">Next</button>
          </div>
        </div>

        <!-- Step 2: Education -->
        <div class="form-step">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Intermediate - University</label>
              <input type="text" class="form-control" name="interUni" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Intermediate - CGPA</label>
              <input type="number" class="form-control" name="interCgpa" step="0.01" min="0" max="5" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Bachelor's - University</label>
              <input type="text" class="form-control" name="bachelorUni" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Bachelor's - CGPA</label>
              <input type="number" class="form-control" name="bachelorCgpa" step="0.01" min="0" max="5" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Master's - University</label>
              <input type="text" class="form-control" name="masterUni" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Master's - CGPA</label>
              <input type="number" class="form-control" name="masterCgpa" step="0.01" min="0" max="5" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">PhD - University</label>
              <input type="text" class="form-control" name="phdUni" placeholder="or N/A" />
            </div>
            <div class="col-md-6">
              <label class="form-label">PhD - CGPA</label>
              <input type="number" class="form-control" name="phdCgpa" step="0.01" min="0" max="5" placeholder="or N/A" />
            </div>
            <div class="col-md-12">
              <label class="form-label">Scholarship to Apply For</label>
              <select class="form-select" name="scholarshipType" id="scholarshipDropdown" required>
                <option value="">Loading scholarships...</option>
              </select>
            </div>
          </div>
          <div class="step-buttons mt-4">
            <button type="button" class="btn btn-secondary" onclick="prevStep()">Previous</button>
            <button type="button" class="btn btn-success" onclick="nextStep()">Next</button>
          </div>
        </div>

        <!-- Step 3: File Upload -->
        <div class="form-step">
          <label class="form-label">Upload Degree Documents (PDF only)</label>
          <input type="file" class="form-control" name="documents" id="pdfFiles" accept=".pdf" multiple required />
          <div id="filePreview" class="file-preview"></div>
          <div class="step-buttons mt-4">
            <button type="button" class="btn btn-secondary" onclick="prevStep()">Previous</button>
            <button type="submit" class="btn btn-success">Submit Application</button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-success text-white text-center py-3">
    <p class="mb-0">© 2025 EduAid | Empowering Education in Pakistan</p>
  </footer>

  <!-- Scripts -->
  <script>
    let currentStep = 0;
    const steps = document.querySelectorAll(".form-step");

    function showStep(index) {
      steps.forEach((step, i) => step.classList.toggle("active", i === index));
    }
    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        showStep(currentStep);
      }
    }
    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        showStep(currentStep);
      }
    }

    // Fetch scholarships
    fetch('/api/scholarships', { credentials: 'include' })
      .then(res => res.json())
      .then(data => {
        const dropdown = document.getElementById('scholarshipDropdown');
        dropdown.innerHTML = '<option value="">Select Scholarship</option>';
        data.forEach(s => {
          const option = document.createElement('option');
          option.value = s.title;
          option.textContent = s.title;
          dropdown.appendChild(option);
        });
      })
      .catch(err => {
        console.error("Error loading scholarships:", err);
        const dropdown = document.getElementById('scholarshipDropdown');
        dropdown.innerHTML = '<option value="">Failed to load scholarships</option>';
      });

    // Validate on submit
    document.getElementById('applicationForm').addEventListener('submit', function (e) {
      const fileInput = document.getElementById('pdfFiles');
      for (const file of fileInput.files) {
        if (file.type !== "application/pdf") {
          alert("Only PDF files are allowed.");
          e.preventDefault();
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          alert("Each file must be less than or equal to 5MB.");
          e.preventDefault();
          return;
        }
      }
    });

    // Preview uploaded PDFs
    document.getElementById('pdfFiles').addEventListener('change', function () {
      const preview = document.getElementById('filePreview');
      preview.innerHTML = '';
      [...this.files].forEach(file => {
        if (file.type === "application/pdf") {
          const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
          preview.innerHTML += `<div>📄 ${file.name} (${sizeMB} MB)</div>`;
        }
      });
    });
  </script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init();</script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
