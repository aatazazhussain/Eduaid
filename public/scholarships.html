<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduAid - Find Your Scholarship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    .disabled-btn {
      pointer-events: none;
      opacity: 0.6;
    }
    .hero-section {
      background-color: #198754; /* Bootstrap success */
      padding: 80px 0;
      color: white;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logo.png" alt="EduAid Logo" height="40" class="me-2" />
      <span class="fw-bold text-success">EduAid</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link text-success" href="index3.html">Home</a></li>
        <li class="nav-item"><a class="nav-link text-success" href="how-it-works.html">How It Works</a></li>
        <li class="nav-item"><a class="nav-link text-success" href="scholarships.html">Find Your Scholarship</a></li>
        <li class="nav-item"><a class="nav-link text-success" href="about.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link text-success" href="news.html">News</a></li>
      </ul>
      <a class="btn btn-success ms-3" href="contact.html">Contact Us</a>
      <a class="btn btn-success ms-3" href="home.html">Logout</a>

    </div>
  </div>
</nav>

<!-- Hero Section (Green Background) -->
<section class="hero-section text-center">
  <div class="container">
    <h1 class="fw-bold">Find Your Scholarship</h1>
    <p class="lead">Explore our Study Now, Pay Later (SNPL) scholarships tailored for all academic levels</p>
  </div>
</section>

<!-- Filter/Search Controls -->
<section class="py-5 bg-light">
  <div class="container">
    <div class="row mb-4">
      <div class="col-md-6 mb-2">
        <input id="searchInput" type="text" class="form-control" placeholder="Search by title or eligibility..." />
      </div>
      <div class="col-md-4 mb-2">
        <select id="filterDropdown" class="form-select">
          <option value="">All Deadlines</option>
          <option value="upcoming">Upcoming</option>
          <option value="expired">Expired</option>
        </select>
      </div>
      <div class="col-md-2 mb-2">
        <button onclick="loadScholarships()" class="btn btn-success w-100">Filter</button>
      </div>
    </div>

    <!-- Scholarships List -->
    <div class="row g-4" id="scholarshipContainer">
      <div class="text-center w-100"><div class="spinner-border text-success"></div></div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-success text-white text-center py-3">
  <p class="mb-0">© 2025 EduAid | Empowering Education in Pakistan</p>
</footer>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init();</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function loadScholarships() {
    const search = document.getElementById('searchInput').value;
    const filter = document.getElementById('filterDropdown').value;

fetch(`/api/scholarships?search=${encodeURIComponent(search)}&deadline=${filter}`, {
  credentials: 'include'
})
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('scholarshipContainer');
        container.innerHTML = '';

        if (!data.length) {
          container.innerHTML = '<p class="text-center">No scholarships found.</p>';
          return;
        }

        data.forEach(s => {
          const disabled = s.seats_left <= 0;
          const card = document.createElement('div');
          card.className = 'col-md-6 col-lg-4';
          card.innerHTML = `
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title text-success">${s.title}</h5>
                <p class="card-text">${s.description}</p>
                <ul class="mb-3">
                  <li><strong>Eligibility:</strong> ${s.eligibility}</li>
                  <li><strong>Deadline:</strong> ${s.deadline}</li>
                  <li><strong>Seats Left:</strong> ${s.seats_left}</li>
                </ul>
                <a href="apply-form.html" class="btn btn-success w-100 ${disabled ? 'disabled-btn' : ''}">
                  ${disabled ? 'Closed' : 'Apply Now'}
                </a>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error loading scholarships:', err);
        document.getElementById('scholarshipContainer').innerHTML = `<p class="text-danger">Failed to load scholarships.</p>`;
      });
  }

  // Load scholarships on page load
  window.onload = loadScholarships;
</script>
</body>
</html>
