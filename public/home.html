<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduAid - Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #e3f2fd, #e8f5e9);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border-radius: 16px;
    }

    .nav-tabs .nav-link.active {
      background-color: #4CAF50;
      color: white !important;
      font-weight: 600;
      border-radius: 0;
    }

    .nav-tabs .nav-link {
      color: #4CAF50;
      font-weight: 500;
    }

    .tab-content {
      padding-top: 20px;
    }

    .btn-eduaid {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-eduaid:hover {
      background-color: #388e3c;
    }

    label {
      font-weight: 500;
      color: #2e7d32;
    }

    h2 {
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <h2 class="text-center text-success mb-4">🎓 Welcome to <strong>EduAid</strong></h2>

  <div class="card mx-auto p-3" style="max-width: 500px;">
    <div class="card-body">

      <!-- Tabs -->
      <ul class="nav nav-tabs justify-content-center" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="user-login-tab" data-bs-toggle="tab" data-bs-target="#user-login" type="button">User Login</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="user-register-tab" data-bs-toggle="tab" data-bs-target="#user-register" type="button">Register</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="admin-login-tab" data-bs-toggle="tab" data-bs-target="#admin-login" type="button">Admin Login</button>
        </li>
      </ul>

      <!-- Tab Contents -->
      <div class="tab-content" id="authTabsContent">
        
        <!-- User Login -->
        <div class="tab-pane fade show active" id="user-login">
          <form id="userLoginForm" action="/api/login" method="POST">
            <div class="mb-3">
              <label>Email:</label>
              <input id="email" type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Password:</label>
              <input id="password" type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-eduaid w-100">Login as User</button>
          </form>
        </div>

        <!-- User Register -->
        <div class="tab-pane fade" id="user-register">
          <form action="/api/register" method="POST">
            <div class="mb-3">
              <label>Name:</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Email:</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Password:</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-eduaid w-100">Register</button>
          </form>
        </div>

        <!-- Admin Login -->
        <div class="tab-pane fade" id="admin-login">
          <form action="/admin-login" method="POST">
            <div class="mb-3">
              <label>Admin Username:</label>
              <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Password:</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-eduaid w-100">Login as Admin</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- JS -->
<script>
  document.getElementById("userLoginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const formData = new URLSearchParams();
    formData.append("email", email);
    formData.append("password", password);

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
      });

      if (!res.ok) {
        const errorText = await res.text();
        alert("Login failed: " + errorText);
        return;
      }

      const data = await res.json();
      localStorage.setItem("token", data.token);
      localStorage.setItem("username", data.name);

      // Redirect to homepage
      window.location.href = "/index3.html";
    } catch (error) {
      alert("Error logging in.");
      console.error(error);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
